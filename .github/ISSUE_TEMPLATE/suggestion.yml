name: Suggestion
description: An idea for a pack, such as a mod to add or something to change.
type: feature
body:
  - type: dropdown
    id: pack
    attributes:
      label: Modpack
      options:
        - "Arcadia: Shadowfall"
        - Avalon Reborn
        - "Create: Industrialized Tech"
        - Fantasy MC Fabric
        - Fantasy MC NeoForge
        - Legacies
        - New Dawn [RPG]
        - Valor
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would add to the pack, or what problem it solves.
