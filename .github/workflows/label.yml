# Labels each issue with the pack its form names and assigns the pack's developer. When the
# reporter edits the pack, the label follows. An issue opened through the API or gh has no form, or
# a pack name the form no longer has: it gets the pack its title and body name, if they name exactly
# one. Otherwise it gets "needs info" and a comment asking which pack, listing the packs it might be.
# The reply that names one labels it. A reply can name part, as "Fabric" to an issue about Fantasy
# MC. A guess never replaces a pack label someone set.
name: label
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const packs = {
              // names: what the text must contain, all of it, to name the pack when the form does not.
              'Arcadia Shadowfall':          { label: 'arcadia-shadowfall', dev: 'Bandit-bytes', names: [/arcadia|shadowfall/i] },
              'Avalon Reborn':               { label: 'avalon-reborn', dev: 'GammaNe0', names: [/avalon/i] },
              'Create: Industrialized Tech': { label: 'create-industrialized-tech', dev: 'VeroxUniverse', names: [/industrialized tech/i] },
              'Fantasy MC Fabric':           { label: 'fantasy-mc-fabric', dev: 'thrasos-dev', names: [/fantasy ?mc/i, /fabric/i] },
              'Fantasy MC NeoForge':         { label: 'fantasy-mc-neoforge', dev: 'thrasos-dev', names: [/fantasy ?mc/i, /neo ?forge/i] },
              'Legacies':                    { label: 'legacies', dev: 'Rebel459', names: [/legacies/i] },
              'New Dawn [RPG]':              { label: 'new-dawn', dev: 'KevzCz', names: [/new dawn/i] },
              'Valor':                       { label: 'valor', dev: 'thrasos-dev', names: [/\bvalor\b/i] },
            };
            const { issue, comment } = context.payload;
            const ref = { ...context.repo, issue_number: issue.number };
            const have = issue.labels.map(l => l.name);
            const ours = new Set(Object.values(packs).map(p => p.label));
            // Only a reply to our question names the pack.
            if (comment && !have.includes('needs info')) return;
            const m = (issue.body || '').match(/### Modpack\s+([^\n]+)/);
            let pack = m ? packs[m[1].trim()] : undefined;
            let maybe = [];
            if (!pack) {
              if (have.some(name => ours.has(name))) return;
              const text = `${issue.title}\n${issue.body || ''}`;
              const said = comment ? comment.body : text;
              const named = Object.values(packs).filter(p =>
                p.names.every(r => r.test(said) || r.test(text)) && p.names.some(r => r.test(said)));
              if (named.length === 1) pack = named[0];
              else maybe = Object.keys(packs).filter(k => packs[k].names[0].test(said));
            }

            if (!pack) {
              // Ask when the issue opens, and again when a reply leaves it between packs.
              if (context.payload.action === 'opened' || (comment && maybe.length > 1)) {
                if (!comment) await github.rest.issues.addLabels({ ...ref, labels: ['needs info'] });
                const which = maybe.length > 1 ? `: ${maybe.slice(0, -1).join(', ')} or ${maybe.at(-1)}` : '';
                await github.rest.issues.createComment({ ...ref, body: `Which modpack is this about${which}? Reply with its name.` });
              }
              return;
            }

            // The pack was picked after our question: take back the "needs info" it added.
            if (have.includes('needs info')) {
              const comments = await github.paginate(github.rest.issues.listComments, ref);
              if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('Which modpack'))) {
                await github.rest.issues.removeLabel({ ...ref, name: 'needs info' });
              }
            }

            for (const name of have) {
              if (ours.has(name) && name !== pack.label) await github.rest.issues.removeLabel({ ...ref, name });
            }
            if (!have.includes(pack.label)) await github.rest.issues.addLabels({ ...ref, labels: [pack.label] });
            if (pack.dev && issue.assignees.length === 0) {
              await github.rest.issues.addAssignees({ ...ref, assignees: [pack.dev] });
            }
