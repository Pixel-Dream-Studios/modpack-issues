# Labels each issue with the pack its form names and assigns the pack's developer. When the
# reporter edits the pack, the label follows. An issue opened without the form names no pack: it
# gets "needs info" and a comment asking for one. The label goes once a pack is added.
name: label
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const packs = {
              'Arcadia Shadowfall':          { label: 'arcadia-shadowfall', dev: 'Bandit-bytes' },
              'Avalon Reborn':               { label: 'avalon-reborn', dev: 'GammaNe0' },
              'Create: Industrialized Tech': { label: 'create-industrialized-tech', dev: 'VeroxUniverse' },
              'Fantasy MC Fabric':           { label: 'fantasy-mc-fabric', dev: 'thrasos-dev' },
              'Fantasy MC NeoForge':         { label: 'fantasy-mc-neoforge', dev: 'thrasos-dev' },
              'Legacies':                    { label: 'legacies', dev: 'Rebel459' },
              'New Dawn [RPG]':              { label: 'new-dawn', dev: 'KevzCz' },
              'Valor':                       { label: 'valor', dev: 'thrasos-dev' },
            };
            const issue = context.payload.issue;
            const ref = { ...context.repo, issue_number: issue.number };
            const m = (issue.body || '').match(/### Modpack\s+([^\n]+)/);
            const pack = m ? packs[m[1].trim()] : undefined;
            const have = issue.labels.map(l => l.name);

            if (!pack) {
              if (context.payload.action === 'opened') {
                await github.rest.issues.addLabels({ ...ref, labels: ['needs info'] });
                await github.rest.issues.createComment({ ...ref, body:
                  'Which modpack is this about? Edit the issue (the ... menu, then Edit) and pick it under Modpack.' });
              }
              return;
            }

            // The pack was picked after our question: take back the "needs info" it added.
            if (have.includes('needs info')) {
              const comments = await github.paginate(github.rest.issues.listComments, ref);
              if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('Which modpack'))) {
                await github.rest.issues.removeLabel({ ...ref, name: 'needs info' });
              }
            }

            const ours = new Set(Object.values(packs).map(p => p.label));
            for (const name of have) {
              if (ours.has(name) && name !== pack.label) await github.rest.issues.removeLabel({ ...ref, name });
            }
            if (!have.includes(pack.label)) await github.rest.issues.addLabels({ ...ref, labels: [pack.label] });
            if (pack.dev && issue.assignees.length === 0) {
              await github.rest.issues.addAssignees({ ...ref, assignees: [pack.dev] });
            }
