# Labels each issue with the pack its form names and assigns the pack's developer. When the
# reporter edits the pack, the labels follow. An issue that names no pack gets "needs info" and a
# comment asking for it.
name: label
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const packs = {
              'Arcadia: Shadowfall':         { labels: ['arcadia-shadowfall'], dev: 'Bandit-bytes' },
              'Avalon Reborn':               { labels: ['avalon-reborn'] },
              'Create: Industrialized Tech': { labels: ['create-industrialized-tech'], dev: 'VeroxUniverse' },
              'Fantasy MC (Fabric)':         { labels: ['fantasy-mc', 'fabric'], dev: 'thrasos-dev' },
              'Fantasy MC (NeoForge)':       { labels: ['fantasy-mc', 'neoforge'], dev: 'thrasos-dev' },
              'Legacies 26':                 { labels: ['legacies'] },
              'Valor':                       { labels: ['valor'], dev: 'thrasos-dev' },
            };
            const issue = context.payload.issue;
            const ref = { ...context.repo, issue_number: issue.number };
            const m = (issue.body || '').match(/### Modpack\s+([^\n]+)/);
            const pack = m ? packs[m[1].trim()] : undefined;
            const have = issue.labels.map(l => l.name);

            if (!pack) {
              if (context.payload.action === 'opened') {
                await github.rest.issues.addLabels({ ...ref, labels: ['needs info'] });
                await github.rest.issues.createComment({ ...ref, body:
                  'Which modpack is this about? Edit the issue (the ... menu, then Edit) and pick it under Modpack.' });
              }
              return;
            }

            const ours = new Set(Object.values(packs).flatMap(p => p.labels));
            for (const name of have) {
              if (ours.has(name) && !pack.labels.includes(name)) await github.rest.issues.removeLabel({ ...ref, name });
            }
            const add = pack.labels.filter(name => !have.includes(name));
            if (add.length) await github.rest.issues.addLabels({ ...ref, labels: add });
            if (pack.dev && issue.assignees.length === 0) {
              await github.rest.issues.addAssignees({ ...ref, assignees: [pack.dev] });
            }
