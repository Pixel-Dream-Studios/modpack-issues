# Labels each issue with the pack its form names, and swaps the label when the reporter edits it.
name: label
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const packs = {
              'Arcadia: Shadowfall': ['arcadia-shadowfall'],
              'Fantasy MC (Fabric)': ['fantasy-mc', 'fabric'],
              'Fantasy MC (NeoForge)': ['fantasy-mc', 'neoforge'],
              'Valor': ['valor'],
            };
            const issue = context.payload.issue;
            const m = (issue.body || '').match(/### Modpack\s+([^\n]+)/);
            if (!m) return;
            const want = packs[m[1].trim()] || [];
            const ours = new Set(Object.values(packs).flat());
            const have = issue.labels.map(l => l.name);
            const ref = { ...context.repo, issue_number: issue.number };
            for (const name of have) {
              if (ours.has(name) && !want.includes(name)) await github.rest.issues.removeLabel({ ...ref, name });
            }
            const add = want.filter(name => !have.includes(name));
            if (add.length) await github.rest.issues.addLabels({ ...ref, labels: add });
